services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payguard
      POSTGRES_PASSWORD: payguard_local_only
      POSTGRES_DB: payguard
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payguard"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes: ["./infra/redis.conf:/usr/local/etc/redis/redis.conf:ro"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://payguard:payguard_local_only@postgres:5432/payguard
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  pgdata:
